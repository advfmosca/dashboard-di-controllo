.kpi{transition:transform .18s ease,box-shadow .18s ease;}

.card,.dcol{transition:transform .2s ease,box-shadow .2s ease;}

.drow .dbar i{transform-origin:left center;animation:growBar .75s cubic-bezier(.22,.61,.36,1) both;}
.mhead{transition:box-shadow .2s ease;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;}

.kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}

.toggle button:disabled{opacity:.4;cursor:not-allowed;}
.mpick{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:inline-flex;align-items:center;gap:8px;}

.dcol{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px 18px;box-shadow:var(--shadow-sm);}

/* ---- obiettivi e fonti ---- */
.btn-pdf{font:inherit;font-size:12px;font-weight:800;padding:8px 16px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:7px;margin-left:auto;box-shadow:var(--shadow-sm);}

.obj{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow-sm);border-top:3px solid var(--navy);}

.plan{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#eef2f3;color:#51636a;white-space:nowrap;}
.plan.warn{background:#fff4e5;color:#b45309;}
.omx{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px;}
.om{background:var(--soft);border:1px solid var(--bsoft);border-radius:10px;padding:9px 11px;}
.om .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
.om .v{font-size:16px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;}
.om .chip{margin-top:4px;}
.ocamp{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.45;}
.onote{font-size:11.5px;color:#b45309;margin-top:8px;}
.insights{margin:0;padding-left:18px;font-size:13px;line-height:1.65;color:#3c474c;}

.plats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.plat{background:var(--soft);border:1px solid var(--bsoft);border-radius:11px;padding:11px 13px;}
.plat .n{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;}
.plat .v{font-size:18px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;}
.plat .s{font-size:11px;color:var(--muted);margin-top:2px;}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.src tbody tr{cursor:default;}
table.src td,table.src th{padding:9px 11px;white-space:nowrap;}
table.src .pbar{display:inline-block;width:46px;height:6px;border-radius:999px;background:#eef2f3;vertical-align:middle;margin-left:6px;overflow:hidden;}
table.src .pbar i{display:block;height:100%;background:var(--gold);}
.srcnote{font-size:11px;color:var(--dim);margin-top:8px;}
.printonly{display:none;}
@media print{
  @page{size:A4;margin:12mm;}
  html,body{background:#fff!important;}
  .wrap{max-width:none;padding:0;}
  .toolbar,.toolrow,.metricsel,.btn-pdf,.srctools,footer.f,.noprint{display:none!important;}
  .printonly{display:block;}
  #view>*{animation:none!important;}
  .card,.obj,.kpi,.dcol,.mhead,.narr,.plat{box-shadow:none!important;break-inside:avoid;}

  .kpi:hover,.dcol:hover{transform:none!important;}

  .chip,.pace,.plan,.splitbar i,.drow .dbar i,.ddot,.pbar i{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

<script>

function fV(v,k){return k==="eur"?fE(v):fI(v);}
function fP(p){return p==null?"n/d":(p>=0?"+":"")+p.toLocaleString("it-IT",{maximumFractionDigits:0})+"%";}
function dpc(c,p){return p?(c-p)/p*100:null;}

function genRational(s){var i=CURIDX,ym=curYM(),name=s.name,hasTT=!!s.has_tiktok;
  var sp=val(s,"combined","spend",i),re=val(s,"meta","reach",i),im=val(s,"combined","impressions",i),inr=val(s,"meta","interazioni",i),cl=val(s,"combined","clicks",i);
  var freq=re>0?im/re:null, ctr=im>0?cl/im*100:null, erx=re>0?inr/re*100:null, cpm=im>0?sp/im*1000:null;
  function dec(n,d){return n.toFixed(d).replace('.',',');}
  var P=[];
  P.push('Nel mese di <b>'+mfull(ym)+'</b> '+name+' ha investito <b>'+fE(sp)+'</b>'+(hasTT?' tra Meta e TikTok':' su Meta')+', raggiungendo <b>'+fI(re)+'</b> account unici e generando <b>'+fI(im)+'</b> visualizzazioni'+(freq?', con una frequenza media di <b>'+dec(freq,1)+'</b> contatti per utente raggiunto — indice di un messaggio ripetuto a sufficienza per restare memorabile senza saturare il pubblico':'')+'.');
  if(i>0){var pv=val(s,"meta","reach",i-1),psp=val(s,"combined","spend",i-1),pl=mfull(HIST.months[i-1]),d=pv?(re-pv)/pv*100:null,ds=psp?(sp-psp)/psp*100:null;
    var bud=(ds!=null&&Math.abs(ds)>=3)?(ds>0?' a fronte di un budget in crescita del '+Math.round(ds)+'%':' pur con un budget ridotto del '+Math.round(-ds)+'%'):' a parità sostanziale di budget';
    if(d==null) P.push('Il confronto con '+pl+' non è disponibile per assenza di uno storico comparabile.');
    else if(d>=2) P.push('Rispetto a '+pl+' la copertura cresce del <b>+'+Math.round(d)+'%</b>'+bud+': la spinta del piano si sta traducendo in una base di pubblico più ampia e in un costo-contatto più efficiente.');
    else if(d<=-2) P.push('Rispetto a '+pl+' la copertura arretra del <b>'+Math.round(d)+'%</b>'+bud+'. È una flessione fisiologica, coerente con la stagionalità del comparto ricettivo e con la risalita dei CPM nei mesi ad alta competizione d\'asta; il presidio del pubblico resta comunque continuativo.');
    else P.push('Rispetto a '+pl+' la copertura si mantiene stabile'+bud+', a conferma di un presidio costante del pubblico di riferimento e di una spesa senza dispersioni.');
  }
  P.push('Sul fronte dell\'engagement si contano <b>'+fI(inr)+'</b> interazioni'+(erx?' (<b>'+dec(erx,1)+'%</b> sugli account raggiunti)':'')+' e <b>'+fI(cl)+'</b> click'+(ctr?', con un tasso di click dello <b>'+dec(ctr,2)+'%</b> sulle visualizzazioni':'')+': segnali di un pubblico non solo esposto ma realmente reattivo al messaggio.');
  if(cpm!=null) P.push('Il costo per mille visualizzazioni si attesta a <b>'+dec(cpm,2)+' €</b>, un livello '+(cpm<=8?'competitivo':cpm<=15?'in linea con i benchmark del settore ricettivo':'sostenuto ma giustificato dalla pressione stagionale')+' per il target presidiato.');
  return '<p>'+P.join('</p><p>')+'</p>';}

/* ---- obiettivi e fonti di traffico ---- */

var NUMK=["spend","reach","impressions","clicks","link_clicks","engagement","lpv","video_views"];
function brk(name,ym){var s=BRK.structures&&BRK.structures[name];return s?s[ym]:null;}
function zero(){var z={purchases:null};NUMK.forEach(function(k){z[k]=0;});return z;}
function addB(a,b){if(!b)return a;NUMK.forEach(function(k){a[k]+=(b[k]||0);});if(b.purchases!=null)a.purchases=(a.purchases||0)+b.purchases;return a;}

function rat(a,b,m){return b?a/b*(m||1):null;}
function f2(n,suf){return n==null?"—":n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2})+(suf||"");}
function f1(n,suf){return n==null?"—":n.toLocaleString("it-IT",{minimumFractionDigits:1,maximumFractionDigits:1})+(suf||"");}
function chipI(d,inv){if(d==null)return '<span class="chip flat">n/d</span>';if(inv===2)return '<span class="chip flat">'+fP(d)+'</span>';var good=inv?d<=0:d>=0;return '<span class="chip '+(Math.abs(d)<1?"flat":(good?"good":"bad"))+'">'+fP(d)+'</span>';}

var OKPI={
 aon:[["Copertura",function(t){return t.reach;},"int"],["CPM",function(t){return rat(t.spend,t.impressions,1000);},"eur2",1],["Frequenza",function(t){return rat(t.impressions,t.reach);},"x",2],["Interazioni",function(t){return t.engagement;},"int"],["Costo per interazione",function(t){return rat(t.spend,t.engagement);},"eur2",1]],
 traffico:[["Click sul link",function(t){return t.link_clicks;},"int"],["CTR link",function(t){return rat(t.link_clicks,t.impressions,100);},"pct"],["CPC link",function(t){return rat(t.spend,t.link_clicks);},"eur2",1],["Visite alla landing",function(t){return t.lpv;},"int"],["Costo per visita",function(t){return rat(t.spend,t.lpv);},"eur2",1]],
 conversioni:[["Click sul link",function(t){return t.link_clicks;},"int"],["Visite alla landing",function(t){return t.lpv;},"int"],["Costo per visita",function(t){return rat(t.spend,t.lpv);},"eur2",1],["Acquisti tracciati",function(t){return t.purchases;},"int"],["Costo per acquisto",function(t){return t.purchases?t.spend/t.purchases:null;},"eur2",1]],
 tematiche:[["Copertura",function(t){return t.reach;},"int"],["CPM",function(t){return rat(t.spend,t.impressions,1000);},"eur2",1],["Interazioni",function(t){return t.engagement;},"int"],["Click sul link",function(t){return t.link_clicks;},"int"]]
};
function fmtK(v,f){if(v==null)return "—";if(f==="eur2")return (v>0&&v<0.1)?v.toLocaleString("it-IT",{minimumFractionDigits:3,maximumFractionDigits:3})+" €":f2(v," €");if(f==="pct")return f2(v,"%");if(f==="x")return f1(v);return fI(v);}
/* il confronto pianificato/reale ha senso solo se i pesi da naming dei canali Meta attivi sommano a 100 e nessun obiettivo e' stato avviato nel mese */
function planCheck(d,pd){var sum=0,ok=true,any=false;d.objectives.forEach(function(o){if(o.meta.spend<=0)return;if(!o.planned_pct||o.planned_pct.length!==1){if(o.planned_pct)ok=false;return;}any=true;sum+=o.planned_pct[0];var po=findObj(pd,o.key);if(!po||po.meta.spend<=0)ok=false;});return any&&ok&&sum===100;}
var PLANOK=false;
function objCard(o,prevO,totSpend,metaTot){
  var t=objTot(o),p=prevO?objTot(prevO):null;if(t.spend<=0)return "";

  var plan="";if(o.planned_pct&&metaTot>0&&o.meta.spend>0){var real=o.meta.spend/metaTot*100,pl=o.planned_pct.join("/");var off=o.planned_pct.length===1&&Math.abs(real-o.planned_pct[0])>10;
    plan=PLANOK?'<span class="plan'+(off?' warn':'')+'" title="Peso da nomenclatura campagna, calcolato sulla spesa Meta">pianificato '+pl+'% · reale '+Math.round(real)+'%</span>':'<span class="plan" title="Peso indicato nella nomenclatura campagna">peso da naming '+pl+'%</span>';}
  if(!prevO||prevO.meta.spend+prevO.tiktok.spend<=0)plan+=(CURIDX>0?' <span class="plan">nuova nel mese</span>':'');

   +'<div class="obj-s"><b>'+fE(t.spend)+'</b> · '+Math.round(share)+'% dell\'investimento'+(ch.length?' · '+ch.join(" + "):'')+'</div>'
   +'<div class="omx">'+k+'</div>'+note
   +'<div class="ocamp">'+(o.campaigns&&o.campaigns.length?'Campagne Meta: '+o.campaigns.join(" · "):'')+(o.tiktok.spend>0&&CURCH!=="meta"?(o.campaigns&&o.campaigns.length?'<br>':'')+'TikTok: campagne Copertura (AON)':'')+'</div></div>';}
function srcRows(d){if(!d)return [];return d.sources.filter(function(x){

  var pos=aggBy(rows,function(x){return x.platform+"|"+x.position_label;},function(x){return x.position_label;});
  var top=pos.slice(0,12),rest=pos.slice(12);if(rest.length){var o=zero();o.label="Altri posizionamenti ("+rest.length+")";o.platform_label="—";o.platform="unknown";o.clk=0;rest.forEach(function(r){addB(o,r);o.clk+=r.clk;});top.push(o);}
  var tb='<div class="tscroll"><table class="src"><thead><tr><th>Piattaforma</th><th>Posizionamento</th><th class="num">Spesa</th><th class="num">Impression</th><th class="num">CPM</th><th class="num">Click</th><th class="num">CTR</th><th class="num">Interazioni</th></tr></thead><tbody>'
    +top.map(function(p){var sh=ps?p.spend/ps*100:0;return '<tr><td><span class="ddot" style="background:'+(PCOL[p.platform]||"#999")+';margin-right:6px;vertical-align:-1px"></span>'+p.platform_label+'</td><td>'+p.label+'</td><td class="num">'+fE(p.spend)+' <span class="pbar"><i style="width:'+Math.max(2,sh)+'%"></i></span></td><td class="num">'+fI(p.impressions)+'</td><td class="num">'+f2(rat(p.spend,p.impressions,1000),' €')+'</td><td class="num">'+fI(p.clk)+'</td><td class="num">'+f2(rat(p.clk,p.impressions,100),'%')+'</td><td class="num">'+fI(p.engagement)+'</td></tr>';}).join("")
    +'</tbody></table></div>';
  return head+bar+cards+'<h2 class="block">Fonti di traffico · piattaforme e posizionamenti</h2>'+ins+'<div class="card">'+tog+pc+tb
    +'<div class="srcnote">Click: su Meta click sul link, su TikTok click totali. Copertura e interazioni per obiettivo sono somme per campagna (un utente raggiunto da più campagne può essere contato più volte). Pesi pianificati letti dalla nomenclatura campagne e confrontati con la sola spesa Meta.</div></div>';}
function wireObj(s){var el=document.getElementById("objsel");if(!el)return;Array.prototype.forEach.call(el.querySelectorAll("button"),function(b){b.addEventListener("click",function(){CUROBJ=b.dataset.o;renderObj(s);});});}
function renderObj(s){var box=document.getElementById("objbox");if(!box)return;box.innerHTML=objHtml(s);wireObj(s);}
function printReport(label){var t=document.title;document.title=label;setTimeout(function(){window.print();setTimeout(function(){document.title=t;},800);},60);}
var PDFICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';
function headHtml(s){var ym=curYM(),p=ym.split("-"),logo=(LINKS[s.name]||{}).logo,cmp=CURIDX>0?mfull(HIST.months[CURIDX-1]):null;
  var left='<div class="mh-left">'+(logo?'<img class="mh-logo" src="'+logo+'" alt="'+s.name+'"/>':'')+'<div class="mh-name">'+s.name+'</div></div>';
  var right='<div class="mh-right"><div class="mh-month">'+MFULL[(+p[1])-1]+' '+p[0]+'</div>'+(cmp?'<div class="mh-cmp">confronto: '+cmp+'</div>':'')+'</div>';
  return left+right;}
function renderClient(name){
  var s=HIST.structures.find(function(x){return x.name===name;});CURS=s;CURCH="combined";CUROBJ="all";CURK="spend";CURFMT="eur";CURIDX=HIST.as_of_idx;
  var v=document.getElementById("view");var hasTT=!!s.has_tiktok;var b=BUD[name];
  var bhtml=b?('<h2 class="block">Budget '+(HIST.as_of_month.split("-")[0])+' · aggiornato a '+HIST.as_of_label+'</h2><div class="card"><div class="bstats">'
    +'<div class="bstat"><div class="bl">Programmato annuo</div><div class="bv">'+fE(b.annual)+'</div></div>'
    +'<div class="bstat"><div class="bl">Speso YTD</div><div class="bv">'+fE(b.ytd_real)+'</div></div>'
    +'<div class="bstat"><div class="bl">Proiezione fine anno</div><div class="bv">'+fE(b.projection_year_end)+'</div></div>'
    +'<div class="bstat"><div class="bl">Passo vs programmato</div><div class="bv"><span class="pace '+b.status+'">'+fP(b.pace_pct)+'</span></div></div>'
    +'</div></div>'):'';
  v.innerHTML='<div class="mhead" id="mhead">'+headHtml(s)+'</div>'
    +'<div class="toolrow"><span class="chsel" id="chsel">'+chselHtml(hasTT)+'</span><label class="mpick">Mese <select id="mpick">'+monthOptions()+'</select></label><button class="btn-pdf" id="pdfbtn" type="button">'+PDFICO+'Scarica PDF</button></div>'
    +'<div class="kpis" id="kpis">'+kpisHtml(s)+'</div><div id="kpinote">'+kpiNote(s)+'</div>'
    +'<h2 class="block" id="histhead">Andamento giornaliero · '+mfull(curYM())+'</h2><div class="card"><div class="metricsel" id="msel"></div><div class="chartwrap"><canvas id="hist"></canvas></div><div id="histmsg" style="text-align:center;color:var(--dim);font-size:12px"></div></div>'
    +'<h2 class="block">Lettura del mese</h2><div class="narr" id="narr">'+genRational(s)+'</div>'
    +'<div id="objbox"></div>'
    +'<div id="demobox">'+demoHtml(name)+'</div>'
    +bhtml;
  document.getElementById("mpick").addEventListener("change",function(){CURIDX=parseInt(this.value,10);refreshMonth(s);});
  document.getElementById("pdfbtn").addEventListener("click",function(){printReport("AGHC - "+s.name+" - "+mfull(curYM()));});
  wireChsel(s,hasTT);buildMsel(s);renderObj(s);drawHist();
}
function renderAll(){
  var v=document.getElementById("view");var i=HIST.as_of_idx;
  var rows=HIST.structures.map(function(s){var sp=s.series.combined.spend[i],re=s.series.meta.reach[i],inr=s.series.meta.interazioni[i],b=BUD[s.name];
    return '<tr data-name="'+s.name.replace(/"/g,"&quot;")+'"><td><b>'+s.name+'</b></td><td class="num">'+fE(sp)+'</td><td class="num">'+fI(re)+'</td><td class="num">'+fI(inr)+'</td><td>'+(b?'<span class="pace '+b.status+'">'+fP(b.pace_pct)+'</span>':'—')+'</td></tr>';}).join("");
  v.innerHTML='<div class="toolrow" style="margin:0"><button class="btn-pdf" id="pdfall" type="button">'+PDFICO+'Scarica PDF panoramica</button></div><h2 class="block">Panoramica — '+HIST.as_of_label+'</h2><div class="card" style="padding:0"><table><thead><tr><th>Struttura</th><th class="num">Investimento</th><th class="num">Copertura · Meta</th><th class="num">Interazioni · Meta</th><th>Passo budget</th></tr></thead><tbody>'+rows+'</tbody></table></div><p style="font-size:12px;color:var(--dim);margin-top:8px">Clicca una struttura per il dettaglio mensile, l\'andamento giornaliero, la lettura del mese e le demografiche.</p>';
  document.getElementById("pdfall").addEventListener("click",function(){printReport("AGHC - Panoramica strutture - "+HIST.as_of_label);});
  Array.prototype.forEach.call(v.querySelectorAll("tbody tr"),function(tr){tr.addEventListener("click",function(){var nloc=tr.getAttribute("data-name");document.getElementById("sel").value=nloc;renderClient(nloc);window.scrollTo({top:0,behavior:"smooth"});});});
}
function boot(){
  document.getElementById("stamp").innerHTML="agg. "+HIST.generated_at;
  document.getElementById("foot").textContent="";
  var sel=document.getElementById("sel");
  HIST.structures.forEach(function(s){var o=document.createElement("option");o.value=s.name;o.textContent=s.name;sel.appendChild(o);});
  sel.addEventListener("change",function(){sel.value==="__all__"?renderAll():renderClient(sel.value);});
  renderAll();
}
Promise.all([
 fetch("aghc_history.json?v="+Date.now()).then(function(r){return r.json();}),
 fetch("aghc_data.json?v="+Date.now()).then(function(r){return r.json();}),
 fetch("aghc_demographics_monthly.json?v="+Date.now()).then(function(r){return r.json();}).catch(function(){return {by_month:{}};}),
 fetch("aghc_daily.json?v="+Date.now()).then(function(r){return r.json();}).catch(function(){return {structures:[]};}),
 fetch("aghc_links.json?v="+Date.now()).then(function(r){return r.json();}).catch(function(){return {structures:{}};}),
 fetch("aghc_breakdown.json?v="+Date.now()).then(function(r){return r.json();}).catch(function(){return {structures:{}};})
]).then(function(a){HIST=a[0];BUD={};(a[1].structures||[]).forEach(function(s){if(s.budget)BUD[s.name]=s.budget;});DEMOM=a[2]||{by_month:{}};DAILY={};(a[3].structures||[]).forEach(function(s){DAILY[s.name]=s;});LINKS=(a[4]&&a[4].structures)||{};BRK=a[5]||{structures:{}};boot();})
 .catch(function(e){document.getElementById("view").innerHTML='<div class="loading">Errore caricamento dati</div>';console.error(e);});
</script></body></html>
