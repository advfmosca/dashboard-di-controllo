<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#1F2A44"/><title>AGHC — Dashboard Team</title>
<link rel="icon" type="image/svg+xml" href="assets/fmm-logo.svg"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#fff;--soft:#f7f8fa;--bsoft:#f0f1f5;--border:#e7e8ee;--text:#1F2A44;--muted:#6b7180;--dim:#9aa0b0;--navy:#1F2A44;--gold:#C9A24B;--green:#1e8e3e;--red:#c0392b;--blue:#0866FF;}
*{box-sizing:border-box;}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px;}
header.h{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
header.h img{width:44px;height:44px;border-radius:50%;}header.h h1{margin:0;font-size:20px;font-weight:800;}header.h .sub{font-size:12px;color:var(--muted);margin-top:2px;}header.h .stamp{margin-left:auto;font-size:11px;color:var(--dim);text-align:right;}
.monthbar{display:flex;align-items:baseline;gap:12px;margin:2px 0 16px;padding-bottom:12px;border-bottom:2px solid var(--gold);flex-wrap:wrap;}
.monthbar .m{font-size:24px;font-weight:800;color:var(--navy);}.monthbar .note{font-size:12px;color:var(--muted);}
.toolbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap;}
.toolbar label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.toolbar select{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:9px;border:1px solid #d2d4dd;background:#fff;cursor:pointer;min-width:260px;}
h2.block{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 10px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.kpi{background:var(--soft);border:1px solid var(--bsoft);border-radius:11px;padding:12px 15px;}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px;}
.kpi .p{font-size:10px;color:var(--dim);margin-top:3px;}
.chip{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;margin-top:4px;}
.chip.good{background:#d1fadf;color:#14532d;}.chip.bad{background:#fee2e2;color:#991b1b;}.chip.flat{background:#eceff1;color:#555;}
.card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px 16px;margin-top:12px;}
.metricsel{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px;}
.metricsel button{font:inherit;font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;border:1px solid #dfe2ea;background:#fff;color:var(--muted);cursor:pointer;}
.metricsel button.on{background:var(--gold);color:#3f3212;border-color:var(--gold);}
.chartwrap{position:relative;height:230px;}
.narr{border-left:3px solid var(--gold);background:#faf7ef;border-radius:0 10px 10px 0;padding:14px 18px;font-size:14px;line-height:1.65;color:#3a4152;}
.narr b{color:var(--navy);}
.bstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.bstat{background:var(--soft);border:1px solid var(--bsoft);border-radius:9px;padding:9px 12px;}
.bstat .bl{font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:700;}.bstat .bv{font-size:17px;font-weight:800;margin-top:3px;}.bstat .bs{font-size:9.5px;color:var(--dim);margin-top:2px;}
.pace{font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px;}.pace.under{background:#e0edff;color:#0b57d0;}.pace.on_track{background:#d1fadf;color:#14532d;}.pace.over{background:#fee2e2;color:#991b1b;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);}
tbody td{padding:9px 12px;border-bottom:1px solid var(--bsoft);}tbody tr{cursor:pointer;}tbody tr:hover{background:var(--soft);}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
footer.f{margin-top:26px;font-size:11px;color:var(--dim);text-align:center;}.loading{padding:60px 0;text-align:center;color:var(--dim);}
</style></head><body>
<div class="wrap">
<header class="h"><img src="assets/fmm-logo.svg" alt="AGHC"/><div><h1>AGHC — Dashboard Team</h1><div class="sub">Ultimo mese, storico e lettura del mese · per struttura</div></div><div class="stamp" id="stamp"></div></header>
<div class="monthbar" id="monthbar"></div>
<div class="toolbar"><label for="sel">Struttura</label><select id="sel"><option value="__all__">Tutte (panoramica)</option></select></div>
<div id="view"><div class="loading">Caricamento dati…</div></div>
<footer class="f" id="foot"></footer>
</div>
<script>
var HIST=null, BUD={}, CH={};
var KDEF=[["spend","Investimento","eur","combined"],["reach","Copertura","int","meta"],["impressions","Visualizzazioni","int","combined"],["interazioni","Interazioni","int","meta"],["clicks","Click","int","combined"]];
var GOOD={spend:true,reach:true,impressions:true,interazioni:true,clicks:true};
function fI(n){return n==null?"—":Math.round(n).toLocaleString("it-IT");}
function fE(n){return n==null?"—":Math.round(n).toLocaleString("it-IT")+" €";}
function fV(v,k){return k==="eur"?fE(v):fI(v);}
function fP(p){return p==null?"n/d":(p>=0?"+":"")+p.toLocaleString("it-IT",{maximumFractionDigits:0})+"%";}
function dpc(c,p){return p?(c-p)/p*100:null;}
function chip(d){if(d==null)return '<span class="chip flat">n/d</span>';return '<span class="chip '+(Math.abs(d)<1?"flat":(d>=0?"good":"bad"))+'">'+fP(d)+'</span>';}
function ser(s,ch,k){var S=s.series;return (S[ch]&&S[ch][k])?S[ch][k]:S.combined[k];}
function val(s,ch,k,i){var a=ser(s,ch,k);return a?a[i]:0;}
function renderClient(name){
  var s=HIST.structures.find(function(x){return x.name===name;});var i=HIST.as_of_idx;var v=document.getElementById("view");
  var khtml=KDEF.map(function(d){var cur=val(s,d[3],d[0],i),prev=val(s,d[3],d[0],i-1);
    return '<div class="kpi"><div class="l">'+d[1]+(d[3]==="meta"?' · Meta':'')+'</div><div class="v">'+fV(cur,d[2])+'</div>'+chip(dpc(cur,prev))+'<div class="p">'+HIST.prev_label+': '+fV(prev,d[2])+'</div></div>';}).join("");
  var b=BUD[name];
  var bhtml=b?('<div class="card"><h2 class="block" style="margin:0 0 10px">Budget '+(HIST.as_of_month.split("-")[0])+'</h2><div class="bstats">'
    +'<div class="bstat"><div class="bl">Programmato annuo</div><div class="bv">'+fE(b.annual)+'</div></div>'
    +'<div class="bstat"><div class="bl">Speso YTD</div><div class="bv">'+fE(b.ytd_real)+'</div></div>'
    +'<div class="bstat"><div class="bl">Proiezione fine anno</div><div class="bv">'+fE(b.projection_year_end)+'</div></div>'
    +'<div class="bstat"><div class="bl">Passo vs programmato</div><div class="bv"><span class="pace '+b.status+'">'+fP(b.pace_pct)+'</span></div></div>'
    +'</div></div>'):'';
  v.innerHTML='<h2 class="block">'+name+' — Ultimo mese: '+HIST.as_of_label+' (vs '+HIST.prev_label+')</h2>'
    +'<div class="kpis">'+khtml+'</div>'
    +'<h2 class="block">Storico mensile</h2><div class="card"><div class="metricsel" id="msel"></div><div class="chartwrap"><canvas id="hist"></canvas></div></div>'
    +'<h2 class="block">Lettura del mese</h2><div class="narr">'+s.rational+'</div>'
    +bhtml;
  var msel=document.getElementById("msel");
  msel.innerHTML=KDEF.map(function(d,k){return '<button class="'+(k===0?"on":"")+'" data-k="'+d[0]+'" data-ch="'+d[3]+'" data-fmt="'+d[2]+'">'+d[1]+'</button>';}).join("");
  Array.prototype.forEach.call(msel.querySelectorAll("button"),function(btn){btn.addEventListener("click",function(){msel.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});btn.classList.add("on");drawHist(s,btn.dataset.k,btn.dataset.ch,btn.dataset.fmt);});});
  drawHist(s,"spend","combined","eur");
}
function drawHist(s,k,ch,fmt){
  if(typeof Chart==="undefined")return;var el=document.getElementById("hist");if(!el)return;var data=ser(s,ch,k);
  if(CH.hist)CH.hist.destroy();
  var i=HIST.as_of_idx;var cols=data.map(function(_,j){return j===i?"#C9A24B":"#1F2A44";});
  CH.hist=new Chart(el,{type:"bar",data:{labels:HIST.month_labels,datasets:[{data:data,backgroundColor:cols,borderRadius:3}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return (fmt==="eur"?(Math.round(c.parsed.y).toLocaleString("it-IT")+" €"):c.parsed.y.toLocaleString("it-IT"));}}}},
     scales:{y:{ticks:{font:{size:9},callback:function(v){return fmt==="eur"?(v>=1000?(v/1000).toFixed(0)+"k€":v+"€"):(v>=1000?(v/1000).toFixed(0)+"k":v);}},grid:{color:"#f0f1f5"}},x:{ticks:{font:{size:9}},grid:{display:false}}}}});
}
function renderAll(){
  var v=document.getElementById("view");var i=HIST.as_of_idx;
  var rows=HIST.structures.map(function(s){var sp=s.series.combined.spend[i],re=s.series.meta.reach[i],inr=s.series.meta.interazioni[i],b=BUD[s.name];
    return '<tr data-name="'+s.name.replace(/"/g,"&quot;")+'"><td><b>'+s.name+'</b></td><td class="num">'+fE(sp)+'</td><td class="num">'+fI(re)+'</td><td class="num">'+fI(inr)+'</td><td>'+(b?'<span class="pace '+b.status+'">'+fP(b.pace_pct)+'</span>':'—')+'</td></tr>';}).join("");
  v.innerHTML='<h2 class="block">Panoramica — '+HIST.as_of_label+'</h2><div class="card" style="padding:0"><table><thead><tr><th>Struttura</th><th class="num">Investimento</th><th class="num">Copertura</th><th class="num">Interazioni</th><th>Passo budget</th></tr></thead><tbody>'+rows+'</tbody></table></div><p style="font-size:12px;color:var(--dim);margin-top:8px">Clicca una struttura per ultimo mese, storico e lettura del mese.</p>';
  Array.prototype.forEach.call(v.querySelectorAll("tbody tr"),function(tr){tr.addEventListener("click",function(){var nloc=tr.getAttribute("data-name");document.getElementById("sel").value=nloc;renderClient(nloc);window.scrollTo({top:0,behavior:"smooth"});});});
}
function boot(){
  document.getElementById("stamp").innerHTML="agg. "+HIST.generated_at;
  document.getElementById("monthbar").innerHTML='<span class="m">'+HIST.as_of_label+'</span><span class="note">ultimo mese chiuso · storico 12 mesi · lettura del mese argomentata</span>';
  document.getElementById("foot").textContent="Dashboard di Controllo — FMM Consulting / AGHC · dati Meta & TikTok via Windsor.ai";
  var sel=document.getElementById("sel");
  HIST.structures.forEach(function(s){var o=document.createElement("option");o.value=s.name;o.textContent=s.name;sel.appendChild(o);});
  sel.addEventListener("change",function(){sel.value==="__all__"?renderAll():renderClient(sel.value);});
  renderAll();
}
Promise.all([fetch("aghc_history.json?v="+Date.now()).then(function(r){return r.json();}),fetch("aghc_data.json?v="+Date.now()).then(function(r){return r.json();})])
 .then(function(a){HIST=a[0];BUD={};(a[1].structures||[]).forEach(function(s){if(s.budget)BUD[s.name]=s.budget;});boot();})
 .catch(function(e){document.getElementById("view").innerHTML='<div class="loading">Errore caricamento dati</div>';console.error(e);});
</script></body></html>
