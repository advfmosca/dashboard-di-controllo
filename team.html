<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#1F2A44"/><title>Dashboard Team</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f7f8; --card:#ffffff; --soft:#f3f6f7; --bsoft:#eaeff1; --border:#e2e8ea;
  --text:#1b2a2f; --muted:#66757b; --dim:#9aa7ad;
  --navy:#1F4E57; --gold:#E0733C; --green:#1e8e3e; --red:#c0392b;
  --shadow-sm:0 1px 2px rgba(16,40,48,.05);
  --shadow:0 1px 2px rgba(16,40,48,.05), 0 10px 28px -18px rgba(16,40,48,.38);
}
*{box-sizing:border-box;}
html{background:var(--bg);}
html,body{min-height:100%;}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.5;}
.logomark{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.03em;font-family:Georgia,'Times New Roman',serif;}
.wrap{max-width:1140px;margin:0 auto;padding:26px 22px 72px;}
header.h{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
header.h img{width:44px;height:44px;border-radius:10px;}
header.h img.brandlogo{height:44px;width:auto;border-radius:0;display:block;}
header.h h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--navy);}
header.h .sub{font-size:12px;color:var(--muted);margin-top:2px;}
header.h .stamp{margin-left:auto;font-size:11px;color:var(--dim);text-align:right;}
.monthbar{display:flex;align-items:center;gap:12px;margin:0 0 20px;flex-wrap:wrap;}
.monthbar .m{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;background:rgba(31,78,87,.07);border:1px solid rgba(31,78,87,.15);border-radius:999px;}
.monthbar .note{font-size:12px;color:var(--muted);}
.toolbar{display:flex;align-items:center;gap:10px;margin:0 0 20px;flex-wrap:wrap;}
.toolbar label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.toolbar select{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid #d5dde0;background:#fff;color:var(--text);cursor:pointer;min-width:270px;box-shadow:var(--shadow-sm);}
.toolbar select:hover{border-color:var(--navy);}
h2.block{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#51636a;margin:26px 0 12px;display:flex;align-items:center;gap:9px;}
h2.block::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--gold);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow-sm);transition:box-shadow .18s ease, transform .18s ease;}
.kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
.kpi .v{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px;color:var(--text);}
.kpi .p{font-size:10.5px;color:var(--dim);margin-top:5px;}
.chip{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-top:6px;}
.chip.good{background:#dcfce7;color:#15803d;}.chip.bad{background:#fee2e2;color:#b91c1c;}.chip.flat{background:#eef2f3;color:#5a6a70;}
.card{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:18px 20px;margin-top:14px;box-shadow:var(--shadow-sm);}
.toolrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;}
.chsel{margin:0;}
.toggle{display:inline-flex;gap:3px;background:var(--bsoft);border:1px solid var(--border);border-radius:11px;padding:3px;}
.toggle button{font:inherit;font-size:12px;font-weight:700;padding:7px 15px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .15s ease;}
.toggle button:hover:not(.on):not(:disabled){color:var(--navy);}
.toggle button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,40,48,.16);}
.toggle button:disabled{opacity:.4;cursor:not-allowed;}
.mpick{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:inline-flex;align-items:center;gap:8px;}
.mpick select{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid #d5dde0;background:#fff;cursor:pointer;text-transform:none;color:var(--text);}
.metricsel{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 14px;}
.metricsel button{font:inherit;font-size:11.5px;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;transition:all .15s ease;}
.metricsel button:hover{border-color:var(--navy);color:var(--navy);}
.metricsel button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.chartwrap{position:relative;height:250px;}
.narr{border-left:3px solid var(--gold);background:#fbf6f1;border-radius:0 12px 12px 0;padding:16px 20px;font-size:14px;line-height:1.7;color:#3c474c;}
.narr b{color:var(--navy);font-weight:700;}
.bstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.bstat{background:var(--soft);border:1px solid var(--bsoft);border-radius:11px;padding:11px 14px;}
.bstat .bl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
.bstat .bv{font-size:18px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;}
.bstat .bs{font-size:9.5px;color:var(--dim);margin-top:2px;}
.pace{font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;}
.pace.under{background:#e0edff;color:#0b57d0;}.pace.on_track{background:#dcfce7;color:#15803d;}.pace.over{background:#fee2e2;color:#b91c1c;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--border);}
tbody td{padding:12px 14px;border-bottom:1px solid var(--bsoft);}
tbody tr{cursor:pointer;transition:background .12s ease;}
tbody tr:hover{background:var(--soft);}
tbody tr:last-child td{border-bottom:0;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
footer.f{margin-top:30px;font-size:11px;color:var(--dim);text-align:center;}
.loading{padding:70px 0;text-align:center;color:var(--dim);}
.dwrap{display:flex;gap:30px;flex-wrap:wrap;}
.dcol{flex:1;min-width:280px;}
.dcol h4{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--navy);}
.dsub{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:12px 0 5px;}
.drow{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:12px;}
.drow .dl{width:82px;color:var(--text);flex-shrink:0;}
.drow .dbar{flex:1;background:#eaeff1;height:9px;border-radius:6px;overflow:hidden;}
.drow .dbar i{display:block;height:100%;border-radius:6px;}
.drow .dp{width:48px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);flex-shrink:0;}
@media(max-width:640px){.wrap{padding:18px 14px 60px;}.kpi .v{font-size:22px;}}
</style></head><body>
<div class="wrap">
<header class="h"><img class="brandlogo" src="assets/logo-aghc.png?v=1" alt="AG Hotel Consulting"/><div><h1>Dashboard Team</h1></div><div class="stamp" id="stamp"></div></header>
<div class="monthbar" id="monthbar"></div>
<div class="toolbar"><label for="sel">Struttura</label><select id="sel"><option value="__all__">Tutte (panoramica)</option></select></div>
<div id="view"><div class="loading">Caricamento dati…</div></div>
<footer class="f" id="foot"></footer>
</div>
<script>
var HIST=null, BUD={}, CH={}, DEMOM={by_month:{}}, DAILY={};
var KDEF=[["spend","Investimento","eur","combined"],["reach","Copertura","int","combined"],["impressions","Visualizzazioni","int","combined"],["interazioni","Interazioni","int","combined"],["clicks","Click","int","combined"]];
function fI(n){return n==null?"—":Math.round(n).toLocaleString("it-IT");}
function fE(n){return n==null?"—":Math.round(n).toLocaleString("it-IT")+" €";}
function fV(v,k){return k==="eur"?fE(v):fI(v);}
function fP(p){return p==null?"n/d":(p>=0?"+":"")+p.toLocaleString("it-IT",{maximumFractionDigits:0})+"%";}
function dpc(c,p){return p?(c-p)/p*100:null;}
function chip(d){if(d==null)return '<span class="chip flat">n/d</span>';return '<span class="chip '+(Math.abs(d)<1?"flat":(d>=0?"good":"bad"))+'">'+fP(d)+'</span>';}
function ser(s,ch,k){var S=s.series;return (S[ch]&&S[ch][k])?S[ch][k]:S.combined[k];}
function val(s,ch,k,i){var a=ser(s,ch,k);return a?a[i]:0;}
var MFULL=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
function mfull(ym){var p=(ym||"").split("-");return p.length>1?MFULL[(+p[1])-1]+" "+p[0]:ym;}
var CURS=null,CURCH="combined",CURK="spend",CURFMT="eur",CURIDX=0;
function curYM(){return HIST.months[CURIDX];}
/* ---- demografiche (per mese) ---- */
function demoBar(items,accent){return (items||[]).map(function(x){return '<div class="drow"><span class="dl">'+x.label+'</span><span class="dbar"><i style="width:'+Math.max(2,x.pct)+'%;background:'+accent+'"></i></span><span class="dp">'+x.pct.toLocaleString("it-IT")+'%</span></div>';}).join("");}
function demoCol(title,blk,accent){if(!blk)return '';return '<div class="dcol"><h4>'+title+'</h4><div class="dsub">Fasce d\'età</div>'+demoBar(blk.age,accent)+'<div class="dsub">Sesso</div>'+demoBar(blk.gender,accent)+'<div class="dsub">Provenienza</div>'+demoBar(blk.geo,accent)+'</div>';}
function demoBlk(name){var mm=DEMOM.by_month&&DEMOM.by_month[curYM()];return mm?mm[name]:null;}
function demoHtml(name){var d=demoBlk(name);var head='<h2 class="block">Demografiche pubblico · '+mfull(curYM())+'</h2>';
 if(!d||(!d.meta&&!d.tiktok))return head+'<div class="card"><p style="margin:0;color:var(--dim);font-size:12px">Dati demografici non disponibili per questo mese.</p></div>';
 return head+'<div class="card"><div class="dwrap">'+demoCol("Meta",d.meta,"#1F4E57")+demoCol("TikTok",d.tiktok,"#E0733C")+'</div></div>';}
/* ---- KPI ---- */
function kchan(d){return CURCH==="combined"?d[3]:CURCH;}
function kpisHtml(s){var i=CURIDX;return KDEF.map(function(d){
  var ch=kchan(d);var cur=val(s,ch,d[0],i),prev=i>0?val(s,ch,d[0],i-1):null;var pl=i>0?mfull(HIST.months[i-1]):"—";
  return '<div class="kpi"><div class="l">'+d[1]+'</div><div class="v">'+fV(cur,d[2])+'</div>'+chip(dpc(cur,prev))+'<div class="p">'+pl+': '+fV(prev,d[2])+'</div></div>';
}).join("");}
function kpiNote(s){return '';}
function chselHtml(hasTT){return '<span class="toggle"><button data-ch="combined" class="'+(CURCH==="combined"?"on":"")+'">Entrambe</button><button data-ch="meta" class="'+(CURCH==="meta"?"on":"")+'">Meta</button><button data-ch="tiktok" '+(hasTT?'':'disabled')+' class="'+(CURCH==="tiktok"?"on":"")+'">TikTok</button></span>';}
function monthOptions(){var o="";HIST.months.forEach(function(ym,idx){if(ym>="2026-01"){o+='<option value="'+idx+'"'+(idx===CURIDX?" selected":"")+'>'+mfull(ym)+'</option>';}});return o;}
/* ---- rational auto per mese ---- */
function genRational(s){var i=CURIDX,ym=curYM(),name=s.name,hasTT=!!s.has_tiktok;
  var sp=val(s,"combined","spend",i),re=val(s,"meta","reach",i),im=val(s,"combined","impressions",i),inr=val(s,"meta","interazioni",i),cl=val(s,"combined","clicks",i);
  var P=[];
  P.push('A <b>'+mfull(ym)+'</b> '+name+' ha registrato un investimento di <b>'+fE(sp)+'</b>'+(hasTT?' (Meta + TikTok)':'')+', con <b>'+fI(re)+'</b> account raggiunti e <b>'+fI(im)+'</b> visualizzazioni.');
  if(i>0){var pv=val(s,"meta","reach",i-1),pl=mfull(HIST.months[i-1]),d=pv?(re-pv)/pv*100:null;
    if(d==null)P.push('Le interazioni si attestano a <b>'+fI(inr)+'</b> e i click a <b>'+fI(cl)+'</b>.');
    else if(d>=2)P.push('Rispetto a '+pl+' la copertura cresce del <b>+'+Math.round(d)+'%</b>, segno di una spinta efficace del piano; interazioni a <b>'+fI(inr)+'</b> e click a <b>'+fI(cl)+'</b>.');
    else if(d<=-2)P.push('Rispetto a '+pl+' si osserva una fisiologica flessione della copertura (<b>'+Math.round(d)+'%</b>), coerente con l\'andamento stagionale e con l\'aumento dei CPM sul comparto ricettivo; il presidio resta solido con <b>'+fI(inr)+'</b> interazioni e <b>'+fI(cl)+'</b> click.');
    else P.push('La copertura si mantiene stabile rispetto a '+pl+', con <b>'+fI(inr)+'</b> interazioni e <b>'+fI(cl)+'</b> click a conferma di un pubblico costantemente presidiato.');
  } else P.push('Interazioni a <b>'+fI(inr)+'</b> e click a <b>'+fI(cl)+'</b>.');
  return P.join(' ');}
/* ---- chart giornaliero ---- */
function dailyOf(name,ym){var s=DAILY[name];return (s&&s.days)?s.days[ym]:null;}
function dserie(dd,ch,k){if(!dd)return null;var blk=dd[ch];if(blk&&blk[k])return blk[k];return dd.combined?dd.combined[k]:null;}
function buildMsel(s){var msel=document.getElementById("msel");msel.innerHTML=KDEF.map(function(d){return '<button class="'+(d[0]===CURK?"on":"")+'" data-k="'+d[0]+'" data-fmt="'+d[2]+'">'+d[1]+'</button>';}).join("");Array.prototype.forEach.call(msel.querySelectorAll("button"),function(btn){btn.addEventListener("click",function(){CURK=btn.dataset.k;CURFMT=btn.dataset.fmt;msel.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});btn.classList.add("on");drawHist();});});}
function wireChsel(s,hasTT){var chsel=document.getElementById("chsel");Array.prototype.forEach.call(chsel.querySelectorAll("button"),function(btn){btn.addEventListener("click",function(){if(btn.hasAttribute("disabled"))return;CURCH=btn.dataset.ch;chsel.innerHTML=chselHtml(hasTT);wireChsel(s,hasTT);document.getElementById("kpis").innerHTML=kpisHtml(s);document.getElementById("kpinote").innerHTML=kpiNote(s);buildMsel(s);drawHist();});});}
function drawHist(){var el=document.getElementById("hist");if(!el)return;var msg=document.getElementById("histmsg");
  var ym=curYM(),dd=dailyOf(CURS.name,ym);if(CH.hist){CH.hist.destroy();CH.hist=null;}
  var data=dd?dserie(dd,CURCH,CURK):null,fmt=CURFMT;
  if(!data){el.style.display="none";if(msg)msg.textContent=dd?"Metrica non disponibile per il canale selezionato.":("Dettaglio giornaliero non disponibile per "+mfull(ym)+".");return;}
  el.style.display="";if(msg)msg.textContent="";
  CH.hist=new Chart(el,{type:"bar",data:{labels:dd.labels,datasets:[{data:data,backgroundColor:"#1F4E57",borderRadius:2}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:function(c){return "Giorno "+c[0].label;},label:function(c){return fmt==="eur"?(Math.round(c.parsed.y).toLocaleString("it-IT")+" €"):c.parsed.y.toLocaleString("it-IT");}}}},
     scales:{y:{ticks:{font:{size:9},callback:function(v){return fmt==="eur"?(v>=1000?(v/1000).toFixed(0)+"k€":v+"€"):(v>=1000?(v/1000).toFixed(0)+"k":v);}},grid:{color:"#f0f1f5"}},x:{ticks:{font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:16},grid:{display:false}}}}});}
function refreshMonth(s){document.getElementById("kpis").innerHTML=kpisHtml(s);document.getElementById("kpinote").innerHTML=kpiNote(s);
  document.getElementById("mhead").textContent=s.name+" — "+mfull(curYM());
  document.getElementById("histhead").textContent="Andamento giornaliero · "+mfull(curYM());
  document.getElementById("narr").innerHTML=genRational(s);
  document.getElementById("demobox").innerHTML=demoHtml(s.name);drawHist();}
function renderClient(name){
  var s=HIST.structures.find(function(x){return x.name===name;});CURS=s;CURCH="combined";CURK="spend";CURFMT="eur";CURIDX=HIST.as_of_idx;
  var v=document.getElementById("view");var hasTT=!!s.has_tiktok;var b=BUD[name];
  var bhtml=b?('<h2 class="block">Budget '+(HIST.as_of_month.split("-")[0])+' · aggiornato a '+HIST.as_of_label+'</h2><div class="card"><div class="bstats">'
    +'<div class="bstat"><div class="bl">Programmato annuo</div><div class="bv">'+fE(b.annual)+'</div></div>'
    +'<div class="bstat"><div class="bl">Speso YTD</div><div class="bv">'+fE(b.ytd_real)+'</div></div>'
    +'<div class="bstat"><div class="bl">Proiezione fine anno</div><div class="bv">'+fE(b.projection_year_end)+'</div></div>'
    +'<div class="bstat"><div class="bl">Passo vs programmato</div><div class="bv"><span class="pace '+b.status+'">'+fP(b.pace_pct)+'</span></div></div>'
    +'</div></div>'):'';
  v.innerHTML='<h2 class="block" id="mhead">'+name+' — '+mfull(curYM())+'</h2>'
    +'<div class="toolrow"><span class="chsel" id="chsel">'+chselHtml(hasTT)+'</span><label class="mpick">Mese <select id="mpick">'+monthOptions()+'</select></label></div>'
    +'<div class="kpis" id="kpis">'+kpisHtml(s)+'</div><div id="kpinote">'+kpiNote(s)+'</div>'
    +'<h2 class="block" id="histhead">Andamento giornaliero · '+mfull(curYM())+'</h2><div class="card"><div class="metricsel" id="msel"></div><div class="chartwrap"><canvas id="hist"></canvas></div><div id="histmsg" style="text-align:center;color:var(--dim);font-size:12px"></div></div>'
    +'<h2 class="block">Lettura del mese</h2><div class="narr" id="narr">'+genRational(s)+'</div>'
    +'<div id="demobox">'+demoHtml(name)+'</div>'
    +bhtml;
  document.getElementById("mpick").addEventListener("change",function(){CURIDX=parseInt(this.value,10);refreshMonth(s);});
  wireChsel(s,hasTT);buildMsel(s);drawHist();
}
function renderAll(){
  var v=document.getElementById("view");var i=HIST.as_of_idx;
  var rows=HIST.structures.map(function(s){var sp=s.series.combined.spend[i],re=s.series.meta.reach[i],inr=s.series.meta.interazioni[i],b=BUD[s.name];
    return '<tr data-name="'+s.name.replace(/"/g,"&quot;")+'"><td><b>'+s.name+'</b></td><td class="num">'+fE(sp)+'</td><td class="num">'+fI(re)+'</td><td class="num">'+fI(inr)+'</td><td>'+(b?'<span class="pace '+b.status+'">'+fP(b.pace_pct)+'</span>':'—')+'</td></tr>';}).join("");
  v.innerHTML='<h2 class="block">Panoramica — '+HIST.as_of_label+'</h2><div class="card" style="padding:0"><table><thead><tr><th>Struttura</th><th class="num">Investimento</th><th class="num">Copertura · Meta</th><th class="num">Interazioni · Meta</th><th>Passo budget</th></tr></thead><tbody>'+rows+'</tbody></table></div><p style="font-size:12px;color:var(--dim);margin-top:8px">Clicca una struttura per il dettaglio mensile, l\'andamento giornaliero, la lettura del mese e le demografiche.</p>';
  Array.prototype.forEach.call(v.querySelectorAll("tbody tr"),function(tr){tr.addEventListener("click",function(){var nloc=tr.getAttribute("data-name");document.getElementById("sel").value=nloc;renderClient(nloc);window.scrollTo({top:0,behavior:"smooth"});});});
}
function boot(){
  document.getElementById("stamp").innerHTML="agg. "+HIST.generated_at;
  document.getElementById("monthbar").innerHTML='<span class="m">'+HIST.as_of_label+'</span>';
  document.getElementById("foot").textContent="";
  var sel=document.getElementById("sel");
  HIST.structures.forEach(function(s){var o=document.createElement("option");o.value=s.name;o.textContent=s.name;sel.appendChild(o);});
  sel.addEventListener("change",function(){sel.value==="__all__"?renderAll():renderClient(sel.value);});
  renderAll();
}
Promise.all([
 fetch("aghc_history.json?v="+Date.now()).then(function(r){return r.json();}),
 fetch("aghc_data.json?v="+Date.now()).then(function(r){return r.json();}),
 fetch("aghc_demographics_monthly.json?v="+Date.now()).then(function(r){return r.json();}).catch(function(){return {by_month:{}};}),
 fetch("aghc_daily.json?v="+Date.now()).then(function(r){return r.json();}).catch(function(){return {structures:[]};})
]).then(function(a){HIST=a[0];BUD={};(a[1].structures||[]).forEach(function(s){if(s.budget)BUD[s.name]=s.budget;});DEMOM=a[2]||{by_month:{}};DAILY={};(a[3].structures||[]).forEach(function(s){DAILY[s.name]=s;});boot();})
 .catch(function(e){document.getElementById("view").innerHTML='<div class="loading">Errore caricamento dati</div>';console.error(e);});
</script></body></html>
